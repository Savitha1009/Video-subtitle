<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video - Automated Subtitle Burner</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Subtitle Burner</div>
        <div class="nav-links">
            <a href="/dashboard" class="btn btn-sm btn-secondary">Dashboard</a>
        </div>
    </nav>
    <div class="container upload-container">
        <h2>Upload Video</h2>
        <form id="uploadForm">
            <div class="form-group">
                <label>Select Video File (MP4, AVI, MOV, MKV)</label>
                <input type="file" id="videoFile" accept=".mp4,.avi,.mov,.mkv" required>
            </div>
            <div class="form-group">
                <label>Subtitle Language</label>
                <select id="language" required>
                    <option value="en-US">English (US)</option>
                    <option value="es-US">Spanish (US)</option>
                    <option value="fr-FR">French</option>
                    <option value="hi-IN">Hindi</option>
                    <option value="ta-IN">Tamil</option>
                </select>
            </div>
            <div class="form-group">
                <label>Subtitle Style</label>
                <select id="style">
                    <option value="default">Default (Bottom Center, White, Black Outline)</option>
                </select>
            </div>
            <div id="uploadStatus" class="status-msg"></div>
            <button type="submit" class="btn btn-primary" id="uploadBtn">Upload & Process</button>
        </form>
    </div>
    <script src="/static/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAuth()) return;
            document.getElementById('uploadForm').addEventListener('submit', handleUpload);
        });
    </script>
</body>
</html>
